name: open-capabilities-http

on:
  push:
    branches:
      - feat/open-capabilities-http-final
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e . pytest
      - name: Compile
        run: python -m compileall -q judge_mcp
      - name: Test
        run: pytest -q
