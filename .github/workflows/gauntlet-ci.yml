name: Judge Gauntlet CI

on:
  pull_request:
  push:
    branches:
      - feat/gauntlet-evals

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: pytest -q
      - run: judge-artifact --help
      - run: judge-gauntlet --help
